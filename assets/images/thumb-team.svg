<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Office Background -->
  <rect width="320" height="400" fill="url(#officeBg)" />

  <!-- Glass Window Partition in Office -->
  <rect x="200" y="20" width="110" height="260" fill="#93c5fd" opacity="0.15" rx="6" />
  <line x1="200" y1="20" x2="200" y2="280" stroke="#cbd5e1" stroke-width="2" />

  <!-- Whiteboard on the left -->
  <rect x="15" y="30" width="170" height="230" rx="8" fill="url(#wbGrad)" stroke="#94a3b8" stroke-width="2" />
  
  <!-- Architecture diagrams on whiteboard -->
  <rect x="30" y="55" width="45" height="25" rx="4" fill="#3b82f6" opacity="0.8" />
  <text x="36" y="71" font-family="sans-serif" font-size="8" fill="#ffffff" font-weight="bold">API Gateway</text>
  
  <line x1="75" y1="67" x2="105" y2="67" stroke="#64748b" stroke-width="2" stroke-dasharray="2,2" />
  
  <rect x="105" y="45" width="55" height="22" rx="4" fill="#10b981" opacity="0.8" />
  <text x="110" y="59" font-family="sans-serif" font-size="7" fill="#ffffff" font-weight="bold">Auth Service</text>

  <rect x="105" y="75" width="55" height="22" rx="4" fill="#6366f1" opacity="0.8" />
  <text x="110" y="89" font-family="sans-serif" font-size="7" fill="#ffffff" font-weight="bold">Data Engine</text>

  <!-- Flow lines & sticky notes -->
  <rect x="35" y="110" width="22" height="22" rx="2" fill="#fde047" />
  <rect x="65" y="110" width="22" height="22" rx="2" fill="#f472b6" />
  <rect x="95" y="110" width="22" height="22" rx="2" fill="#67e8f9" />

  <path d="M 40 160 Q 90 140 140 170" fill="none" stroke="#2563eb" stroke-width="2" />
  <circle cx="40" cy="160" r="4" fill="#2563eb" />
  <circle cx="140" cy="170" r="4" fill="#2563eb" />

  <!-- Team silhouettes / figures -->
  <!-- Person 1 (drawing on whiteboard) -->
  <circle cx="130" cy="225" r="16" fill="#334155" />
  <path d="M 112 290 C 112 250, 148 250, 148 290 Z" fill="#1e293b" />
  <!-- Arm pointing to board -->
  <line x1="125" y1="248" x2="90" y2="180" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />

  <!-- Person 2 (collaborator) -->
  <circle cx="195" cy="235" r="15" fill="#475569" />
  <path d="M 178 300 C 178 262, 212 262, 212 300 Z" fill="#0284c7" />

  <!-- Person 3 (taking notes) -->
  <circle cx="250" cy="245" r="15" fill="#64748b" />
  <path d="M 232 310 C 232 272, 268 272, 268 310 Z" fill="#334155" />
  <!-- Notepad -->
  <rect x="236" y="275" width="18" height="24" rx="2" fill="#f8fafc" stroke="#94a3b8" />

  <!-- Ground shadow -->
  <ellipse cx="160" cy="380" rx="140" ry="12" fill="#cbd5e1" opacity="0.6" />
</svg>
