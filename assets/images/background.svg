<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4997e5" />
      <stop offset="35%" stop-color="#72b5f0" />
      <stop offset="70%" stop-color="#a4d3f7" />
      <stop offset="100%" stop-color="#d9edfc" />
    </linearGradient>
    <radialGradient id="sun" cx="78%" cy="18%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#fff8db" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="cloudBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Sky gradient -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  
  <!-- Sun glare -->
  <circle cx="1500" cy="180" r="500" fill="url(#sun)" />

  <!-- Soft background clouds -->
  <g filter="url(#cloudBlur)" fill="#ffffff" opacity="0.65">
    <ellipse cx="250" cy="220" rx="240" ry="120" />
    <ellipse cx="420" cy="260" rx="280" ry="140" />
    <ellipse cx="700" cy="380" rx="360" ry="160" />
    <ellipse cx="1400" cy="320" rx="420" ry="190" />
    <ellipse cx="1650" cy="280" rx="300" ry="150" />
    <ellipse cx="950" cy="680" rx="550" ry="200" opacity="0.75" />
    <ellipse cx="300" cy="850" rx="420" ry="180" opacity="0.8" />
    <ellipse cx="1700" cy="820" rx="460" ry="200" opacity="0.85" />
  </g>

  <!-- Foreground crisp cloud shapes -->
  <g filter="url(#softBlur)" fill="#ffffff" opacity="0.85">
    <ellipse cx="350" cy="240" rx="160" ry="90" />
    <ellipse cx="480" cy="220" rx="130" ry="80" />
    <ellipse cx="1450" cy="280" rx="200" ry="110" />
    <ellipse cx="1320" cy="310" rx="170" ry="95" />
    <ellipse cx="260" cy="800" rx="260" ry="110" />
    <ellipse cx="1600" cy="780" rx="280" ry="120" />
  </g>
</svg>
