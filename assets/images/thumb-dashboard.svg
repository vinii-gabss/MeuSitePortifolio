<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <!-- Modern Dashboard UI -->
  <rect width="320" height="400" fill="#f8fafc" />

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="60" height="400" fill="#0f172a" />
  <circle cx="30" cy="25" r="10" fill="#38bdf8" />
  <rect x="15" y="60" width="30" height="6" rx="2" fill="#94a3b8" />
  <rect x="15" y="80" width="30" height="6" rx="2" fill="#38bdf8" />
  <rect x="15" y="100" width="30" height="6" rx="2" fill="#94a3b8" />
  <rect x="15" y="120" width="30" height="6" rx="2" fill="#94a3b8" />

  <!-- Top bar -->
  <rect x="60" y="0" width="260" height="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="75" y="12" width="100" height="16" rx="4" fill="#f1f5f9" />
  <circle cx="295" cy="20" r="10" fill="#cbd5e1" />

  <!-- KPI Metric Cards -->
  <!-- Card 1 -->
  <rect x="75" y="55" width="110" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="85" y="72" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="600">TOTAL USERS</text>
  <text x="85" y="95" font-family="sans-serif" font-size="16" fill="#0f172a" font-weight="bold">89,451</text>
  <text x="85" y="107" font-family="sans-serif" font-size="8" fill="#10b981" font-weight="600">+12.5%</text>

  <!-- Card 2 -->
  <rect x="195" y="55" width="110" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="205" y="72" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="600">REVENUE (MTD)</text>
  <text x="205" y="95" font-family="sans-serif" font-size="16" fill="#0f172a" font-weight="bold">$345.1K</text>
  <text x="205" y="107" font-family="sans-serif" font-size="8" fill="#10b981" font-weight="600">+8.2%</text>

  <!-- Big Chart Card -->
  <rect x="75" y="125" width="230" height="140" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="88" y="145" font-family="sans-serif" font-size="10" fill="#0f172a" font-weight="bold">Performance Analytics</text>
  
  <!-- Bar chart bars -->
  <rect x="95" y="200" width="14" height="45" rx="3" fill="#cbd5e1" />
  <rect x="115" y="185" width="14" height="60" rx="3" fill="#cbd5e1" />
  <rect x="135" y="170" width="14" height="75" rx="3" fill="#3b82f6" />
  <rect x="155" y="190" width="14" height="55" rx="3" fill="#cbd5e1" />
  <rect x="175" y="165" width="14" height="80" rx="3" fill="#3b82f6" />
  <rect x="195" y="155" width="14" height="90" rx="3" fill="#1d4ed8" />
  <rect x="215" y="175" width="14" height="70" rx="3" fill="#cbd5e1" />
  <rect x="235" y="160" width="14" height="85" rx="3" fill="#3b82f6" />
  <rect x="255" y="150" width="14" height="95" rx="3" fill="#1d4ed8" />

  <!-- Trend Line -->
  <path d="M 102 195 Q 140 160 182 155 T 262 140" fill="none" stroke="#0ea5e9" stroke-width="3" />
  <circle cx="262" cy="140" r="4" fill="#0ea5e9" stroke="#ffffff" stroke-width="2" />

  <!-- Data Table Card below -->
  <rect x="75" y="275" width="230" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="88" y="295" font-family="sans-serif" font-size="9" fill="#0f172a" font-weight="bold">Recent Transactions</text>

  <!-- Table rows -->
  <line x1="88" y1="305" x2="292" y2="305" stroke="#f1f5f9" stroke-width="1" />
  <rect x="88" y="315" width="40" height="6" rx="2" fill="#64748b" />
  <rect x="170" y="315" width="30" height="6" rx="2" fill="#0f172a" />
  <rect x="250" y="312" width="40" height="12" rx="4" fill="#dcfce7" />

  <line x1="88" y1="332" x2="292" y2="332" stroke="#f1f5f9" stroke-width="1" />
  <rect x="88" y="342" width="40" height="6" rx="2" fill="#64748b" />
  <rect x="170" y="342" width="30" height="6" rx="2" fill="#0f172a" />
  <rect x="250" y="339" width="40" height="12" rx="4" fill="#dcfce7" />

  <line x1="88" y1="359" x2="292" y2="359" stroke="#f1f5f9" stroke-width="1" />
  <rect x="88" y="369" width="40" height="6" rx="2" fill="#64748b" />
  <rect x="170" y="369" width="30" height="6" rx="2" fill="#0f172a" />
  <rect x="250" y="366" width="40" height="12" rx="4" fill="#fee2e2" />
</svg>
