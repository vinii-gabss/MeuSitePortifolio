<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Minecraft Gradient -->
    <linearGradient id="mc-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Red Dead Gradient -->
    <linearGradient id="rdr-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="35%" stop-color="#dc2626" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base UI Background -->
  <rect width="600" height="340" fill="url(#gz-bg)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="600" height="52" fill="#0d131f" />
  <line x1="0" y1="52" x2="600" y2="52" stroke="#1f293d" stroke-width="1" />

  <!-- Logo -->
  <text x="32" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Games<tspan fill="#38bdf8">Zone</tspan>
  </text>

  <!-- Nav links -->
  <text x="210" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Início</text>
  <text x="260" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Jogos</text>
  <text x="310" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Sobre</text>

  <!-- Search / Action icon -->
  <circle cx="560" cy="26" r="14" fill="#1e293b" />
  <path d="M556 22 A4 4 0 1 1 564 22 A4 4 0 1 1 556 22 M563 25 L567 29" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- GAMES CARDS ROW -->
  <!-- Card 1: MINECRAFT -->
  <g filter="url(#shadow)">
    <rect x="32" y="76" width="254" height="232" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <clipPath id="mc-clip">
      <rect x="32" y="76" width="254" height="232" rx="14" />
    </clipPath>

    <g clip-path="url(#mc-clip)">
      <!-- Minecraft Scene Sky -->
      <rect x="32" y="76" width="254" height="150" fill="url(#mc-sky)" />

      <!-- Sun -->
      <rect x="230" y="90" width="26" height="26" fill="#fef08a" />

      <!-- Cubic Clouds -->
      <rect x="60" y="95" width="45" height="14" fill="#ffffff" opacity="0.85" />
      <rect x="85" y="90" width="35" height="14" fill="#ffffff" opacity="0.85" />
      <rect x="150" y="110" width="55" height="12" fill="#ffffff" opacity="0.8" />

      <!-- Minecraft Mountains / Blocks -->
      <!-- Back mountains -->
      <path d="M32 170 L70 140 L120 170 L180 135 L240 170 L286 145 L286 230 L32 230 Z" fill="#22c55e" opacity="0.7" />

      <!-- Dirt cliff blocks -->
      <rect x="32" y="180" width="254" height="60" fill="#78350f" />
      <rect x="32" y="174" width="254" height="12" fill="#15803d" />

      <!-- Pixels texture -->
      <rect x="60" y="190" width="12" height="12" fill="#58250a" />
      <rect x="110" y="200" width="14" height="14" fill="#58250a" />
      <rect x="180" y="195" width="12" height="12" fill="#58250a" />
      <rect x="220" y="185" width="10" height="10" fill="#58250a" />

      <!-- Tree -->
      <rect x="80" y="130" width="16" height="46" fill="#451a03" />
      <rect x="64" y="105" width="48" height="35" fill="#166534" />
      <rect x="72" y="95" width="32" height="15" fill="#22c55e" />

      <!-- Title Banner inside Card -->
      <rect x="32" y="226" width="254" height="82" fill="#0b1120" />
      <text x="50" y="258" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff" letter-spacing="0.04em">MINECRAFT</text>
      <text x="50" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Exploração e criatividade sem limites</text>
      <circle cx="256" cy="265" r="13" fill="#0284c7" />
      <polygon points="253,260 262,265 253,270" fill="#ffffff" />
    </g>
  </g>

  <!-- Card 2: RED DEAD REDEMPTION -->
  <g filter="url(#shadow)">
    <rect x="314" y="76" width="254" height="232" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <clipPath id="rdr-clip">
      <rect x="314" y="76" width="254" height="232" rx="14" />
    </clipPath>

    <g clip-path="url(#rdr-clip)">
      <!-- Red Dead Scene Sky -->
      <rect x="314" y="76" width="254" height="150" fill="url(#rdr-sky)" />

      <!-- Massive Sun / Crimson glow -->
      <circle cx="441" cy="155" r="48" fill="#fef08a" opacity="0.35" />

      <!-- Mountain Silhouette -->
      <path d="M314 175 L360 145 L400 165 L445 130 L490 160 L540 135 L568 155 L568 230 L314 230 Z" fill="#2b0a0a" />

      <!-- Cowboy Silhouette -->
      <!-- Hat -->
      <ellipse cx="441" cy="132" rx="22" ry="5" fill="#0a0505" />
      <path d="M433 132 Q441 122 449 132 Z" fill="#0a0505" />
      <!-- Head / neck -->
      <circle cx="441" cy="136" r="6" fill="#0a0505" />
      <!-- Torso / Poncho / Coat -->
      <path d="M428 142 L454 142 L458 178 L424 178 Z" fill="#0a0505" />
      <!-- Rifle held upright -->
      <line x1="456" y1="118" x2="451" y2="175" stroke="#0a0505" stroke-width="3" />

      <!-- Ground / Rocks -->
      <rect x="314" y="178" width="254" height="52" fill="#140505" />

      <!-- Title Banner inside Card -->
      <rect x="314" y="226" width="254" height="82" fill="#0b1120" />
      <text x="332" y="258" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="0.04em">RED DEAD II</text>
      <text x="332" y="280" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Uma saga épica pelo Velho Oeste</text>
      <circle cx="538" cy="265" r="13" fill="#dc2626" />
      <polygon points="535,260 544,265 535,270" fill="#ffffff" />
    </g>
  </g>
</svg>
