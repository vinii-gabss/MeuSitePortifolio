<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Background Sky -->
    <linearGradient id="gi-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Glass Facade Gradient -->
    <linearGradient id="glass-facade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#0369a1" />
      <stop offset="70%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="btn-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <filter id="building-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-4" dy="10" stdDeviation="8" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Base Background -->
  <rect width="600" height="340" fill="#ffffff" />

  <!-- Navbar -->
  <rect x="0" y="0" width="600" height="48" fill="#ffffff" />
  <line x1="0" y1="48" x2="600" y2="48" stroke="#f1f5f9" stroke-width="1.5" />

  <!-- Logo -->
  <g transform="translate(36, 17)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#0284c7" />
    <circle cx="7" cy="7" r="3" fill="#ffffff" />
    <text x="22" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
      Grupo <tspan fill="#0284c7">Integrado</tspan>
    </text>
  </g>

  <!-- Nav links -->
  <text x="290" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0284c7">Início</text>
  <text x="335" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Cursos</text>
  <text x="385" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Sobre</text>
  <text x="430" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Contato</text>

  <!-- Search icon -->
  <circle cx="550" cy="24" r="12" fill="#f8fafc" />
  <path d="M547 21 A3.5 3.5 0 1 1 553 21 A3.5 3.5 0 1 1 547 21 M552 24 L555 27" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- LEFT HERO CONTENT -->
  <g transform="translate(38, 90)">
    <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#0f2847" line-height="1.15">
      Seu futuro
    </text>
    <text x="0" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="800" fill="#0284c7">
      começa aqui
    </text>

    <text x="0" y="106" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">
      Educação de excelência para transformar
    </text>
    <text x="0" y="122" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">
      sua trajetória e impulsionar sua carreira.
    </text>

    <!-- Button -->
    <rect x="0" y="145" width="115" height="34" rx="8" fill="url(#btn-blue)" />
    <text x="22" y="166" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      Saiba mais
    </text>
  </g>

  <!-- RIGHT HERO: MODERN ARCHITECTURAL GLASS BUILDING -->
  <g transform="translate(290, 48)">
    <clipPath id="arch-clip">
      <rect x="0" y="0" width="310" height="292" />
    </clipPath>

    <g clip-path="url(#arch-clip)">
      <!-- Sky behind building -->
      <rect x="0" y="0" width="310" height="292" fill="url(#gi-sky)" />

      <!-- Soft Sun Glow -->
      <circle cx="80" cy="40" r="60" fill="#ffffff" opacity="0.4" />

      <!-- Modern Angular Glass Building Architecture -->
      <!-- Main High-rise angular glass tower -->
      <polygon points="40,292 100,50 250,90 280,292" fill="url(#glass-facade)" filter="url(#building-shadow)" />

      <!-- Perspective Window Grid / Curtain Wall -->
      <!-- Floor lines (horizontal) -->
      <line x1="93" y1="75" x2="253" y2="110" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />
      <line x1="86" y1="102" x2="256" y2="132" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />
      <line x1="79" y1="130" x2="260" y2="155" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />
      <line x1="72" y1="160" x2="264" y2="182" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />
      <line x1="64" y1="192" x2="268" y2="210" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />
      <line x1="56" y1="225" x2="272" y2="238" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />
      <line x1="48" y1="260" x2="276" y2="268" stroke="#bae6fd" stroke-width="1.8" opacity="0.8" />

      <!-- Vertical Mullions -->
      <line x1="125" y1="58" x2="70" y2="292" stroke="#e0f2fe" stroke-width="1.5" opacity="0.65" />
      <line x1="155" y1="65" x2="110" y2="292" stroke="#e0f2fe" stroke-width="1.5" opacity="0.65" />
      <line x1="185" y1="73" x2="155" y2="292" stroke="#e0f2fe" stroke-width="1.5" opacity="0.65" />
      <line x1="215" y1="80" x2="200" y2="292" stroke="#e0f2fe" stroke-width="1.5" opacity="0.65" />
      <line x1="245" y1="88" x2="245" y2="292" stroke="#e0f2fe" stroke-width="1.5" opacity="0.65" />

      <!-- Diagonal modern support struts / architectural feature -->
      <polygon points="100,50 115,50 65,292 48,292" fill="#ffffff" opacity="0.3" />
      <line x1="100" y1="50" x2="280" y2="292" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

      <!-- Left Angular Annex -->
      <polygon points="0,292 40,140 100,165 40,292" fill="#0369a1" opacity="0.85" />
      <line x1="40" y1="140" x2="40" y2="292" stroke="#ffffff" stroke-width="2" />
      <line x1="0" y1="180" x2="50" y2="185" stroke="#7dd3fc" stroke-width="1.2" />
      <line x1="0" y1="220" x2="45" y2="223" stroke="#7dd3fc" stroke-width="1.2" />

      <!-- Trees / Landscape at base -->
      <ellipse cx="60" cy="292" rx="30" ry="18" fill="#15803d" />
      <ellipse cx="100" cy="295" rx="25" ry="15" fill="#16a34a" />
      <ellipse cx="260" cy="290" rx="40" ry="20" fill="#15803d" />
    </g>
  </g>
</svg>
