<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <!-- VS Code Dark Editor -->
  <rect width="320" height="400" fill="#181a1f" />
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="45" height="400" fill="#21252b" />
  <circle cx="22" cy="25" r="7" fill="#4d78cc" />
  <circle cx="22" cy="55" r="7" fill="#abb2bf" opacity="0.4" />
  <circle cx="22" cy="85" r="7" fill="#abb2bf" opacity="0.4" />
  
  <!-- File tree explorer -->
  <rect x="45" y="0" width="85" height="400" fill="#1e2227" />
  <rect x="55" y="20" width="55" height="10" rx="3" fill="#61afef" opacity="0.8" />
  <rect x="62" y="42" width="50" height="7" rx="2" fill="#abb2bf" opacity="0.5" />
  <rect x="62" y="58" width="60" height="7" rx="2" fill="#e5c07b" opacity="0.8" />
  <rect x="62" y="74" width="45" height="7" rx="2" fill="#abb2bf" opacity="0.5" />

  <!-- Code area top tabs -->
  <rect x="130" y="0" width="190" height="32" fill="#21252b" />
  <rect x="135" y="6" width="75" height="26" rx="4" fill="#181a1f" />
  <text x="145" y="22" font-family="monospace" font-size="10" fill="#61afef">App.jsx</text>

  <!-- Line numbers & code lines -->
  <g font-family="monospace" font-size="10">
    <!-- Line 1 -->
    <rect x="145" y="48" width="35" height="8" rx="2" fill="#c678dd" />
    <rect x="185" y="48" width="40" height="8" rx="2" fill="#e5c07b" />
    <rect x="230" y="48" width="25" height="8" rx="2" fill="#61afef" />

    <!-- Line 2 -->
    <rect x="145" y="68" width="60" height="8" rx="2" fill="#98c379" />
    
    <!-- Line 3 -->
    <rect x="145" y="90" width="45" height="8" rx="2" fill="#c678dd" />
    <rect x="195" y="90" width="65" height="8" rx="2" fill="#61afef" />
    
    <!-- Line 4 (indent) -->
    <rect x="160" y="112" width="30" height="8" rx="2" fill="#e06c75" />
    <rect x="195" y="112" width="40" height="8" rx="2" fill="#d19a66" />
    <rect x="240" y="112" width="55" height="8" rx="2" fill="#98c379" />

    <!-- Line 5 -->
    <rect x="160" y="134" width="70" height="8" rx="2" fill="#e5c07b" />
    <rect x="235" y="134" width="45" height="8" rx="2" fill="#c678dd" />

    <!-- Line 6 -->
    <rect x="175" y="156" width="85" height="8" rx="2" fill="#61afef" />
    <rect x="265" y="156" width="35" height="8" rx="2" fill="#abb2bf" />

    <!-- Line 7 -->
    <rect x="160" y="178" width="50" height="8" rx="2" fill="#98c379" />

    <!-- Line 8 -->
    <rect x="145" y="200" width="20" height="8" rx="2" fill="#c678dd" />

    <!-- Line 9: return () -->
    <rect x="145" y="222" width="45" height="8" rx="2" fill="#c678dd" />
    <rect x="195" y="222" width="20" height="8" rx="2" fill="#abb2bf" />

    <!-- Line 10: JSX -->
    <rect x="160" y="244" width="65" height="8" rx="2" fill="#e06c75" />
    <rect x="230" y="244" width="60" height="8" rx="2" fill="#d19a66" />

    <rect x="175" y="266" width="75" height="8" rx="2" fill="#61afef" />
    <rect x="175" y="288" width="90" height="8" rx="2" fill="#98c379" />
    
    <rect x="160" y="310" width="45" height="8" rx="2" fill="#e06c75" />
    <rect x="145" y="332" width="20" height="8" rx="2" fill="#abb2bf" />
  </g>

  <!-- Minimap in editor -->
  <rect x="295" y="35" width="20" height="355" fill="#21252b" opacity="0.6" />
</svg>
