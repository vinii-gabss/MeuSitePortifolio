<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d5b8" />
      <stop offset="100%" stop-color="#e9be9c" />
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="100%" stop-color="#0f2238" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Shoulders / Suit -->
  <path d="M 60 400 C 70 300, 130 260, 200 260 C 270 260, 330 300, 340 400 Z" fill="url(#suit)" />

  <!-- White shirt collar -->
  <polygon points="200,265 170,230 185,290" fill="#ffffff" />
  <polygon points="200,265 230,230 215,290" fill="#ffffff" />
  <polygon points="185,290 200,340 215,290" fill="#ffffff" />

  <!-- Neck -->
  <rect x="175" y="195" width="50" height="60" rx="8" fill="url(#skin)" />
  <path d="M 175 220 Q 200 235 225 220 L 225 255 L 175 255 Z" fill="#d8ab87" opacity="0.3" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="165" rx="58" ry="72" fill="url(#skin)" />

  <!-- Hair -->
  <path d="M 142 150 C 138 95, 170 80, 200 80 C 235 80, 262 95, 258 150 C 255 125, 230 98, 200 98 C 168 98, 146 125, 142 150 Z" fill="#2d2319" />
  <path d="M 142 145 C 138 120, 160 90, 200 90 C 240 90, 262 120, 258 145 C 248 108, 230 102, 200 102 C 165 102, 148 112, 142 145 Z" fill="#1b140d" />

  <!-- Beard -->
  <path d="M 152 170 C 152 225, 175 242, 200 242 C 225 242, 248 225, 248 170 C 248 185, 235 230, 200 230 C 165 230, 152 185, 152 170 Z" fill="#281e14" opacity="0.85" />
  
  <!-- Eyes & Eyebrows -->
  <ellipse cx="178" cy="150" rx="4.5" ry="4" fill="#241a12" />
  <ellipse cx="222" cy="150" rx="4.5" ry="4" fill="#241a12" />
  <path d="M 166 138 Q 178 132 190 137" stroke="#241a12" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 210 137 Q 222 132 234 138" stroke="#241a12" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 197 150 Q 200 172 205 174" stroke="#c9956d" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Smile -->
  <path d="M 184 194 Q 200 205 216 194" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
</svg>
